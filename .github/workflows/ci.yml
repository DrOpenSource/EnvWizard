name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Port scanning and process termination behave differently per OS (netstat / lsof / ss),
    # so the real-socket and real-process tests must run on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
