<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2845"/>
      <stop offset="50%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>
    <linearGradient id="wand-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="spark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS Squircle Frame -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#sq-bg)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Electric Plug Base (Diagonal) -->
  <g transform="translate(64,64) rotate(-45) translate(-64,-64)" stroke="url(#wand-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Prongs -->
    <line x1="52" y1="36" x2="52" y2="24"/>
    <line x1="76" y1="36" x2="76" y2="24"/>
    <!-- Body -->
    <path d="M44 48 C44 38, 84 38, 84 48 L84 66 C84 76, 44 76, 44 66 Z" fill="rgba(99,102,241,0.15)"/>
    <!-- Wand Stem Passing Through -->
    <line x1="64" y1="20" x2="64" y2="108" stroke="#818cf8" stroke-width="5"/>
  </g>

  <!-- Magic Spark at Wand Tip -->
  <g transform="translate(86, 38)" filter="url(#spark-glow)">
    <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>
</svg>
